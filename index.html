<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Reserva tu cita en Skin Lux by Javiera. Elige tu tratamiento, revisa el valor y encuentra días y horarios disponibles.">
<meta name="theme-color" content="#FDFCFA">
<title>Agenda · Skin Lux by Javiera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --cream:    #EDEAE4;
  --cream-2:  #E5E1D9;
  --cream-3:  #F5F3EF;
  --brown:    #6B3F2A;
  --brown-2:  #8B5A3C;
  --brown-lt: #F0E6DF;
  --gold:     #B8964E;
  --gold-lt:  #F5EDDA;
  --ink:      #2A1F18;
  --ink-soft: #6B5040;
  --ink-muted:#A08070;
  --white:    #FDFCFA;
  --border:   #D9D0C4;
  --r: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Jost', sans-serif; font-weight: 300; background: var(--cream); color: var(--ink); min-height: 100vh; font-size: 14px; }

/* HEADER */
header {
  background: var(--white); border-bottom: 1px solid var(--border);
  padding: 0 2rem; height: 60px; display: flex; align-items: center;
  justify-content: space-between; position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 8px rgba(42,31,24,.05);
}
.logo { text-decoration: none; display: flex; flex-direction: column; gap: 0; line-height: 1; }
.logo-main { font-family: 'Cormorant Garamond', serif; font-weight: 600; font-size: 19px; letter-spacing: .16em; color: var(--ink); text-transform: uppercase; }
.logo-sub  { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 300; font-size: 13px; color: var(--gold); letter-spacing: .05em; }
.header-right { display: flex; align-items: center; gap: 10px; }
.badge { font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; }
.badge-admin  { background: var(--brown-lt); color: var(--brown); }
.badge-client { background: var(--gold-lt); color: #7A5A00; }
.btn { padding: 7px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--white); color: var(--ink-soft); font-size: 12px; font-family: 'Jost', sans-serif; font-weight: 400; cursor: pointer; transition: all .15s; white-space: nowrap; }
.btn:hover { background: var(--cream-2); border-color: var(--brown); color: var(--ink); }
.btn-primary { background: var(--brown); color: var(--white); border-color: var(--brown); font-weight: 500; }
.btn-primary:hover { background: var(--brown-2); border-color: var(--brown-2); }
.btn-sm { padding: 5px 12px; font-size: 11px; }
.btn-ghost { background: none; border-color: transparent; color: var(--ink-muted); }
.btn-ghost:hover { background: var(--cream-2); border-color: transparent; color: var(--ink); }
.back-link { font-size: 11px; color: var(--ink-muted); text-decoration: none; letter-spacing: .04em; display: flex; align-items: center; gap: 5px; transition: color .15s; }
.back-link:hover { color: var(--brown); }

/* LOADING */
.loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100vh - 60px); gap: 14px; color: var(--ink-muted); }
.spinner { width: 24px; height: 24px; border: 1.5px solid var(--border); border-top-color: var(--brown); border-radius: 50%; animation: spin .9s linear infinite; }
.loading-txt { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ADMIN LAYOUT */
.app { display: grid; grid-template-columns: 256px 1fr; min-height: calc(100vh - 60px); }
.sidebar { background: var(--white); border-right: 1px solid var(--border); padding: 1.5rem 1.25rem; display: flex; flex-direction: column; gap: 1.75rem; overflow-y: auto; }
.main { padding: 1.75rem 2rem; overflow-y: auto; }
.sec-lbl { font-size: 9px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }

/* MINI CAL */
.mini-nav-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.mini-cal-title { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 600; color: var(--ink); }
.mini-nav { display: flex; gap: 2px; }
.mini-nav button { background: none; border: none; cursor: pointer; color: var(--ink-muted); font-size: 15px; padding: 2px 6px; border-radius: 4px; }
.mini-nav button:hover { color: var(--brown); }
.mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 1px; text-align: center; }
.mini-grid .dl { font-size: 9px; color: var(--ink-muted); padding: 3px 0; font-weight: 500; }
.mini-day { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; font-size: 11px; border-radius: 50%; cursor: pointer; color: var(--ink-soft); margin: auto; transition: background .1s; position: relative; }
.mini-day:hover { background: var(--brown-lt); }
.mini-day.today { background: var(--brown-lt); color: var(--brown); font-weight: 500; }
.mini-day.selected { background: var(--brown); color: white; }
.mini-day.no-atiende { color: var(--border); cursor: default; }
.mini-day.no-atiende:hover { background: none; }
.mini-day.has-cita::after { content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%); width: 3px; height: 3px; background: var(--gold); border-radius: 50%; }
.mini-day.empty { cursor: default; }

/* STATS */
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-card { background: var(--cream); border-radius: 8px; padding: 10px 12px; text-align: center; }
.stat-num { font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 300; color: var(--brown); line-height: 1; }
.stat-lbl { font-size: 9px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin-top: 3px; }

/* UPCOMING */
.upcoming-list { display: flex; flex-direction: column; gap: 5px; max-height: 200px; overflow-y: auto; }
.upcoming-item { background: var(--cream); border-radius: 7px; padding: 8px 10px; border-left: 2px solid var(--brown-lt); cursor: pointer; transition: border-color .15s; }
.upcoming-item:hover { border-color: var(--brown); }
.up-hora { font-size: 10px; font-weight: 500; color: var(--gold); letter-spacing: .03em; }
.up-nombre { font-size: 12px; color: var(--ink); margin-top: 1px; }
.up-servicio { font-size: 10px; color: var(--ink-muted); margin-top: 1px; }

/* MAIN HEADER */
.main-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); }
.fecha-title { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--ink); }
.fecha-sub { font-size: 11px; color: var(--ink-muted); margin-top: 3px; letter-spacing: .02em; }
.main-actions { display: flex; gap: 8px; align-items: center; }
.view-tabs { display: flex; gap: 2px; background: var(--cream-2); border-radius: 6px; padding: 3px; }
.view-tab { padding: 5px 14px; border-radius: 4px; border: none; background: none; font-size: 11px; font-family: 'Jost', sans-serif; font-weight: 400; color: var(--ink-muted); cursor: pointer; transition: all .15s; }
.view-tab.active { background: var(--white); color: var(--brown); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* TURNO BANNER */
.turno-banner { border-radius: 8px; padding: 10px 14px; margin-bottom: 1.25rem; font-size: 13px; font-weight: 300; display: flex; align-items: center; gap: 10px; }
.turno-banner.dia      { background: #FEF3E2; color: #7A4E00; border: 1px solid #F0D090; }
.turno-banner.noche    { background: #EEF0FB; color: #353A80; border: 1px solid #A8B0E0; }
.turno-banner.saliente { background: #EDFAF3; color: #1E5E40; border: 1px solid #80C8A0; }
.turno-banner.libre    { background: var(--brown-lt); color: var(--brown); border: 1px solid #D8B8A8; }

/* SCHEDULE */
.schedule-grid { display: flex; flex-direction: column; }
.time-slot { display: grid; grid-template-columns: 68px 1fr; min-height: 64px; border-bottom: 1px solid var(--border); }
.time-slot:last-child { border-bottom: none; }
.time-label { font-size: 11px; color: var(--ink-muted); padding: 16px 0 0 0; font-weight: 400; letter-spacing: .02em; font-family: 'Cormorant Garamond', serif; font-size: 14px; }
.slot-area { border-left: 1px solid var(--border); padding: 8px 14px; cursor: pointer; transition: background .1s; min-height: 64px; display: flex; align-items: center; }
.slot-area:hover { background: var(--cream-2); }
.slot-area.has-cita { cursor: default; background: none; }
.slot-hint { font-size: 11px; color: var(--ink-muted); opacity: 0; transition: opacity .1s; }
.slot-area:hover .slot-hint { opacity: 1; }
.cita-block { background: var(--brown-lt); border-left: 3px solid var(--brown); border-radius: 0 6px 6px 0; padding: 8px 12px; width: 100%; }
.cita-block.gold { background: var(--gold-lt); border-color: var(--gold); }
.cita-nombre { font-size: 13px; color: var(--ink); font-weight: 400; }
.cita-servicio { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.cita-tel { font-size: 10px; color: var(--ink-muted); margin-top: 2px; }
.cita-actions { display: flex; gap: 6px; margin-top: 8px; }
.cita-actions button { font-size: 10px; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--border); background: var(--white); color: var(--ink-soft); cursor: pointer; font-family: 'Jost', sans-serif; transition: all .12s; }
.cita-actions button:hover { background: var(--cream-2); }
.cita-actions button.del { color: #b83030; border-color: #e8c0c0; }
.cita-actions button.del:hover { background: #fdf0f0; }
.no-atiende-full { text-align: center; padding: 4rem 1rem; color: var(--ink-muted); }
.no-atiende-full .icon { font-size: 30px; margin-bottom: 12px; }

/* WEEK */
.week-cell { border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 52px; padding: 6px; cursor: pointer; transition: background .1s; display: flex; align-items: center; }
.week-cell:hover { background: var(--cream-2); }
.week-header { background: var(--cream-2); text-align: center; padding: 10px 4px; font-size: 11px; color: var(--ink-soft); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); letter-spacing: .02em; }
.week-header.today-col { background: var(--brown-lt); color: var(--brown); }
.week-cell.time-col { background: var(--cream); cursor: default; font-family: 'Cormorant Garamond', serif; font-size: 14px; color: var(--ink-muted); justify-content: center; padding: 6px 8px; }
.week-cell.time-col:hover { background: var(--cream); }
.week-cell.bloqueada { background: repeating-linear-gradient(135deg,transparent,transparent 4px,var(--cream-2) 4px,var(--cream-2) 8px); cursor: default; opacity: .4; }
.week-cell.bloqueada:hover { background: repeating-linear-gradient(135deg,transparent,transparent 4px,var(--cream-2) 4px,var(--cream-2) 8px); }
.week-cita { background: var(--brown-lt); border-left: 2px solid var(--brown); border-radius: 3px; padding: 3px 6px; font-size: 11px; color: var(--ink); width: 100%; cursor: pointer; }

/* CLIENTE */
.cliente-wrap { max-width: 1040px; margin: 0 auto; padding: 2.5rem 1.5rem; }
.booking-intro { margin-bottom: 1.5rem; }
.booking-eyebrow { color: var(--gold); font-size: 10px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 5px; }
.booking-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(30px,4vw,44px); font-weight: 300; line-height: 1.05; color: var(--ink); }
.booking-subtitle { color: var(--ink-soft); font-size: 13px; line-height: 1.6; margin-top: 7px; }
.reserva-grid { display: grid; grid-template-columns: minmax(280px,.9fr) minmax(360px,1.1fr); gap: 1.25rem; align-items: start; }
.reserva-panel { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 1.35rem; box-shadow: 0 8px 30px rgba(42,31,24,.04); }
.reserva-panel .servicios-list { margin-bottom: 0; }
.reserva-placeholder { min-height: 290px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink-muted); font-size: 13px; line-height: 1.7; padding: 2rem; }
.steps { display: flex; gap: 5px; align-items: center; margin-bottom: 2rem; }
.step { height: 3px; width: 24px; border-radius: 2px; background: var(--border); transition: all .25s; }
.step.active { width: 40px; background: var(--brown); }
.step.done { background: var(--brown); opacity: .4; }
.section-h { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; color: var(--ink); margin-bottom: .75rem; }

/* DÍAS SCROLL */
.dias-scroll { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 1.75rem; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
.dias-scroll::-webkit-scrollbar { height: 2px; }
.dias-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.dia-btn { flex-shrink: 0; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; padding: 10px 14px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; transition: all .15s; min-width: 62px; }
.dia-btn.selected { background: var(--brown); border-color: var(--brown); }
.dia-btn.selected .dia-nom, .dia-btn.selected .dia-num { color: white; }
.dia-btn:not(.selected):hover { border-color: var(--brown); background: var(--brown-lt); }
.dia-nom { font-size: 9px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
.dia-num { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 300; color: var(--ink); line-height: 1; }
.dia-dot { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; margin-top: 4px; }
.dia-btn.selected .dia-dot { background: rgba(255,255,255,.6); }

/* HORAS */
.horas-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 1.5rem; }
.hora-btn { padding: 13px 8px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--white); font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300; color: var(--ink); cursor: pointer; transition: all .15s; text-align: center; }
.hora-btn:hover { border-color: var(--brown); background: var(--brown-lt); }
.hora-btn.selected { background: var(--brown); border-color: var(--brown); color: white; }
.hora-btn.ocupada { background: var(--cream); color: var(--ink-muted); cursor: not-allowed; text-decoration: line-through; opacity: .5; }

/* SERVICIOS */
.servicios-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.5rem; }
.servicio-card { padding: 14px 16px; border-radius: 9px; border: 1.5px solid var(--border); background: var(--white); cursor: pointer; transition: all .15s; display: flex; justify-content: space-between; align-items: center; }
.servicio-card:hover { border-color: var(--brown); }
.servicio-card.selected { border-color: var(--brown); background: var(--brown-lt); }
.serv-nombre { font-size: 14px; color: var(--ink); font-weight: 400; }
.serv-dur { font-size: 11px; color: var(--ink-muted); margin-top: 2px; }
.serv-precio { font-family: 'Cormorant Garamond', serif; font-size: 16px; color: var(--gold); white-space: nowrap; margin-left: 12px; }
.serv-check { font-size: 15px; color: var(--brown); margin-left: 8px; }

/* FORM */
.form-group { margin-bottom: 14px; }
.inp-label { font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 5px; display: block; }
.inp { width: 100%; padding: 11px 14px; border-radius: 7px; border: 1.5px solid var(--border); background: var(--white); font-size: 14px; font-family: 'Jost', sans-serif; font-weight: 300; color: var(--ink); transition: border-color .15s; }
.inp:focus { outline: none; border-color: var(--brown); }
.inp::placeholder { color: var(--ink-muted); }

/* CONFIRM */
.confirm-box { background: var(--white); border: 1.5px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 1.25rem; }
.confirm-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 13px; }
.confirm-row:last-child { margin-bottom: 0; }
.confirm-lbl { color: var(--ink-muted); font-size: 11px; letter-spacing: .04em; }
.confirm-val { color: var(--ink); font-weight: 400; text-align: right; }
.confirm-sep { height: 1px; background: var(--border); margin: 10px 0; }

/* MI CITA */
.mi-cita-card { background: var(--brown-lt); border: 1.5px solid var(--brown); border-radius: 10px; padding: 20px; margin-bottom: 1.5rem; }
.mi-cita-title { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--brown); margin-bottom: 12px; }

/* MODAL */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(42,31,24,.45); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
.modal-bg.open { display: flex; }
.modal { background: var(--white); border-radius: 12px; padding: 2rem; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 64px rgba(42,31,24,.18); }
.modal-title { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 400; margin-bottom: 1.25rem; color: var(--ink); }
.modal-row { margin-bottom: 14px; }
.modal-actions { display: flex; gap: 8px; margin-top: 1.5rem; justify-content: flex-end; }

/* SELECTOR DE HORA TIPO RUEDA — IGUAL EN SAFARI MAC, IPAD Y IPHONE */
.hora24-trigger { min-width: 132px; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 7px; background: var(--white); color: var(--ink); font: 400 14px 'Jost',sans-serif; cursor: pointer; }
.hora24-trigger:hover,.hora24-trigger:focus { outline: none; border-color: var(--brown); }
.hora-wheel-bg { position: fixed; inset: 0; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(42,31,24,.48); backdrop-filter: blur(5px); }
.hora-wheel-card { width: min(360px,100%); padding: 22px; border-radius: 22px; background: rgba(255,255,255,.96); box-shadow: 0 24px 70px rgba(42,31,24,.25); }
.hora-wheel-title { text-align: center; margin-bottom: 14px; font: 400 22px 'Cormorant Garamond',serif; }
.hora-wheel-columns { position: relative; display: grid; grid-template-columns: 1fr 20px 1fr; align-items: center; }
.hora-wheel-columns::after { content: ''; position: absolute; left: 0; right: 0; top: 88px; height: 44px; z-index: 0; border-radius: 12px; background: rgba(120,70,45,.10); pointer-events: none; }
.hora-wheel-sep { z-index: 2; text-align: center; font-size: 25px; }
.hora-wheel { height: 220px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; mask-image: linear-gradient(transparent,#000 25%,#000 75%,transparent); -webkit-mask-image: linear-gradient(transparent,#000 25%,#000 75%,transparent); }
.hora-wheel::-webkit-scrollbar { display: none; }
.hora-wheel-pad { height: 88px; }
.hora-wheel button { display: block; width: 100%; height: 44px; border: 0; background: transparent; color: var(--ink-muted); font: 300 19px 'Jost',sans-serif; scroll-snap-align: center; cursor: pointer; }
.hora-wheel button.selected { position: relative; z-index: 2; color: var(--ink); font-size: 25px; font-weight: 400; }
.hora-wheel-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* CONFIG HORARIOS */
.horas-config-grid { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.hora-tag { display: flex; align-items: center; gap: 5px; background: var(--cream); border: 1px solid var(--border); border-radius: 5px; padding: 5px 10px; font-size: 12px; color: var(--ink-soft); }
.hora-tag .rm { background: none; border: none; cursor: pointer; color: var(--ink-muted); font-size: 15px; line-height: 1; padding: 0 2px; }
.hora-tag .rm:hover { color: #b83030; }
.add-hora-row { display: flex; gap: 8px; align-items: center; }
.turno-cfg { margin-bottom: 1.5rem; }
.turno-cfg-title { font-size: 11px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 10px; }

/* LOGIN */
.login-wrap { max-width: 300px; margin: 5rem auto; text-align: center; padding: 2.5rem 2rem; background: var(--white); border-radius: 12px; box-shadow: 0 8px 32px rgba(42,31,24,.08); }
.login-wrap h2 { font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; margin-bottom: 6px; }
.login-wrap p { font-size: 12px; color: var(--ink-muted); margin-bottom: 1.5rem; }
.pin-inputs { display: flex; gap: 10px; justify-content: center; margin-bottom: 1rem; }
.pin-inputs input { width: 48px; height: 54px; border-radius: 8px; border: 1.5px solid var(--border); background: var(--cream); text-align: center; font-size: 22px; font-family: 'Cormorant Garamond', serif; outline: none; }
.pin-inputs input:focus { border-color: var(--brown); background: var(--white); }
.login-err { font-size: 12px; color: #b83030; min-height: 16px; margin-bottom: 10px; }

/* TOAST */
.toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--ink); color: white; padding: 10px 20px; border-radius: 8px; font-size: 12px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 300; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* DIVIDER ✦ */
.divider { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; color: var(--gold); font-size: 10px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

@media (max-width: 640px) {

let modo='cliente', adminAuth=false;

// Rueda propia en formato 24 horas. Su aspecto y comportamiento no dependen
// del selector nativo del sistema operativo ni de la configuración regional.
function selectorHora24(id,valor='',oculto=false){
  const [horaSel='',minSel='']=valor.split(':');
  return `<div id="${id}-wrap" style="display:${oculto?'none':'flex'};align-items:center">
    <button type="button" class="hora24-trigger" id="${id}-display" onclick="abrirRuedaHora('${id}')">${valor||'Seleccionar hora'}</button>
    <input type="hidden" id="${id}-hh" value="${horaSel}"><input type="hidden" id="${id}-mm" value="${minSel}">
  </div>`;
}
function valorHora24(id){
  const hh=document.getElementById(`${id}-hh`)?.value||'';
  const mm=document.getElementById(`${id}-mm`)?.value||'';
  return hh!==''&&mm!==''?`${hh}:${mm}`:'';
}
let RUEDA_ID='',RUEDA_HORA='09',RUEDA_MINUTO='00';
window.abrirRuedaHora=function(id){
  RUEDA_ID=id;RUEDA_HORA=document.getElementById(`${id}-hh`)?.value||'09';RUEDA_MINUTO=document.getElementById(`${id}-mm`)?.value||'00';
  const opciones=(tipo,total,sel)=>`<div class="hora-wheel-pad"></div>${Array.from({length:total},(_,i)=>{const v=String(i).padStart(2,'0');return `<button type="button" class="${v===sel?'selected':''}" onclick="elegirRuedaHora('${tipo}','${v}',this)">${v}</button>`}).join('')}<div class="hora-wheel-pad"></div>`;
  const fondo=document.createElement('div');fondo.id='horaWheelBg';fondo.className='hora-wheel-bg';
  fondo.innerHTML=`<div class="hora-wheel-card" role="dialog" aria-modal="true" aria-label="Seleccionar hora en formato 24 horas"><div class="hora-wheel-title">Seleccionar hora · 24 horas</div><div class="hora-wheel-columns"><div class="hora-wheel" id="ruedaHoras">${opciones('h',24,RUEDA_HORA)}</div><div class="hora-wheel-sep">:</div><div class="hora-wheel" id="ruedaMinutos">${opciones('m',60,RUEDA_MINUTO)}</div></div><div class="hora-wheel-actions"><button type="button" class="btn" onclick="cerrarRuedaHora()">Cancelar</button><button type="button" class="btn btn-primary" onclick="confirmarRuedaHora()">Aceptar</button></div></div>`;
  fondo.addEventListener('click',e=>{if(e.target===fondo)cerrarRuedaHora()});document.body.appendChild(fondo);
  requestAnimationFrame(()=>fondo.querySelectorAll('.selected').forEach(x=>x.scrollIntoView({block:'center'})));
};
window.elegirRuedaHora=function(tipo,valor,boton){
  if(tipo==='h')RUEDA_HORA=valor;else RUEDA_MINUTO=valor;
  boton.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));boton.classList.add('selected');boton.scrollIntoView({behavior:'smooth',block:'center'});
};
window.cerrarRuedaHora=function(){document.getElementById('horaWheelBg')?.remove();};
window.confirmarRuedaHora=function(){
  document.getElementById(`${RUEDA_ID}-hh`).value=RUEDA_HORA;document.getElementById(`${RUEDA_ID}-mm`).value=RUEDA_MINUTO;
  document.getElementById(`${RUEDA_ID}-display`).textContent=`${RUEDA_HORA}:${RUEDA_MINUTO}`;
  if(RUEDA_ID==='mHcustom')document.getElementById('mH').value='custom';cerrarRuedaHora();
};
let miCitaId=localStorage.getItem('skinlux_mi_cita')||null;

// ── HELPERS ───────────────────────────────────────────────────
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseDate(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function horaNum(h){const[hh,mm]=h.split(':').map(Number);return hh*60+mm;}
function horasFecha(date){return [...(DISPONIBILIDAD[dateStr(date)]||[])].sort((a,b)=>horaNum(a)-horaNum(b));}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

// ── INIT ──────────────────────────────────────────────────────
async function init(){
  db.collection('citas').orderBy('fecha').orderBy('hora').onSnapshot(snap=>{
    const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
    const cfg=docs.find(d=>d.id==='config_horarios');
    DISPONIBILIDAD=cfg?.disponibilidad||{};
    citas=docs.filter(d=>d.id!=='config_horarios');citasLoaded=true;renderAll();
  },err=>{citasLoaded=true;renderAll();showToast('Error: '+err.code);});
}
init();

  else{badge.textContent='Reservar';badge.className='badge badge-client';btn.textContent='Admin';}

function renderAdmin(){
  document.getElementById('appRoot').innerHTML=`
  <div class="app">

      <div>
        <div class="mini-nav-row">
          <span class="mini-cal-title" id="mCalTitle"></span>

        </div>
      </div>

        <div class="sec-lbl">Próximas citas</div>

      </div>

          <button class="btn btn-primary btn-sm" onclick="openModalAdmin()">+ Nueva cita</button>

      </div>

      <div id="vSem" style="${currentView==='semana'?'':'display:none'}"></div>
    </main>

  renderMiniCal();renderStats();renderUpcoming();
  if(currentView==='dia')renderDia();else renderSemana();

window.sView=function(v){currentView=v;renderAdmin();};
window.cambiarMes=function(d){calViewDate.setMonth(calViewDate.getMonth()+d);renderMiniCal();};

function renderMiniCal(){
  const el=document.getElementById('mCalTitle');if(!el)return;
  const y=calViewDate.getFullYear(),m=calViewDate.getMonth();
  el.textContent=MESES_C[m]+' '+y;
  const g=document.getElementById('miniGrid');g.innerHTML='';
  ['L','M','M','J','V','S','D'].forEach(d=>{const e=document.createElement('div');e.className='dl';e.textContent=d;g.appendChild(e);});
  const fd=new Date(y,m,1);let sd=fd.getDay();sd=sd===0?6:sd-1;
  const dim=new Date(y,m+1,0).getDate();
  const tS=dateStr(today),sS=dateStr(selectedDate);
  for(let i=0;i<sd;i++){const e=document.createElement('div');e.className='mini-day empty';g.appendChild(e);}
  for(let d=1;d<=dim;d++){
    const dt=new Date(y,m,d),dS=dateStr(dt),horas=horasFecha(dt);
    const e=document.createElement('div');e.className='mini-day';e.textContent=d;
    if(dS===tS)e.classList.add('today');if(dS===sS)e.classList.add('selected');
    if(!horas.length)e.classList.add('no-atiende');
    if(citas.some(c=>c.fecha===dS))e.classList.add('has-cita');
    e.onclick=()=>{selectedDate=new Date(y,m,d);renderAdmin();};
    g.appendChild(e);
  }
}
function renderStats(){
  const sm=document.getElementById('sMes'),sh=document.getElementById('sHoy');if(!sm)return;
  const ms=selectedDate.getMonth(),an=selectedDate.getFullYear();
  sm.textContent=citas.filter(c=>{const d=parseDate(c.fecha);return d.getMonth()===ms&&d.getFullYear()===an;}).length;
  sh.textContent=citas.filter(c=>c.fecha===dateStr(selectedDate)).length;
}
function renderUpcoming(){
  const ul=document.getElementById('upList');if(!ul)return;
  const tS=dateStr(today),prox=citas.filter(c=>c.fecha>=tS).slice(0,5);
  ul.innerHTML='';
  if(!prox.length){ul.innerHTML='<div style="font-size:11px;color:var(--ink-muted);text-align:center;padding:8px 0">Sin citas próximas</div>';return;}
  prox.forEach(c=>{
    const d=parseDate(c.fecha),dS=dateStr(d);
    const lbl=dS===tS?'Hoy':DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);
    const el=document.createElement('div');el.className='upcoming-item';
    el.innerHTML=`<div class="up-hora">${lbl} · ${c.hora}</div><div class="up-nombre">${c.nombre}</div><div class="up-servicio">${c.servicio}</div>`;
    el.onclick=()=>{selectedDate=new Date(d);currentView='dia';renderAdmin();};
    ul.appendChild(el);
  });
}
function renderDia(){
  const dS=dateStr(selectedDate),horas=horasFecha(selectedDate);
  const citasHoy=citas.filter(c=>c.fecha===dS);
  document.getElementById('fTitle').textContent=DIASL[selectedDate.getDay()]+', '+selectedDate.getDate()+' de '+MESES[selectedDate.getMonth()];
  document.getElementById('fSub').textContent=horas.length?horas.length+' horario'+(horas.length!==1?'s':'')+' publicado'+(horas.length!==1?'s':''):'Sin horarios publicados';
  const cont=document.getElementById('vDia');cont.innerHTML='';
  cont.innerHTML+=`<div class="turno-banner libre"><span>✦</span><span>${horas.length?'Disponibilidad configurada manualmente para esta fecha.':'Aún no has publicado horarios para esta fecha.'}</span></div>`;
  if(!horas.length){cont.innerHTML+=`<div class="no-atiende-full"><div class="icon">＋</div><p>Sin horarios disponibles.</p><button class="btn btn-primary btn-sm" style="margin-top:12px" onclick="abrirConfigHorarios()">Configurar esta fecha</button></div>`;return;}
  const grid=document.createElement('div');grid.className='schedule-grid';
  horas.forEach(hora=>{
    const slot=document.createElement('div');slot.className='time-slot';
    const lbl=document.createElement('div');lbl.className='time-label';lbl.textContent=hora;slot.appendChild(lbl);
    const area=document.createElement('div');area.className='slot-area';
    const cita=citasHoy.find(c=>c.hora===hora);
    if(cita){
      area.classList.add('has-cita');
      const serv=SERVICIOS.find(s=>s.nombre===cita.servicio)||SERVICIOS[0];
      const block=document.createElement('div');
      block.className='cita-block'+(serv.color==='gold'?' gold':'');
      block.innerHTML=`<div class="cita-nombre">${cita.nombre}</div><div class="cita-servicio">${cita.servicio}</div>${cita.telefono?`<div class="cita-tel">${cita.telefono}</div>`:''}<div class="cita-actions"><button onclick="editarCita('${cita.id}')">Editar</button><button class="del" onclick="eliminarCita('${cita.id}')">Eliminar</button></div>`;
      area.appendChild(block);
    }else{
      area.innerHTML=`<span class="slot-hint">+ Agregar cita</span>`;area.onclick=()=>openModalAdmin(hora);
    }
    slot.appendChild(area);grid.appendChild(slot);
  });
  cont.appendChild(grid);
}
function renderSemana(){
  const dow=selectedDate.getDay(),diff=dow===0?-6:1-dow;
  const lunes=new Date(selectedDate);lunes.setDate(selectedDate.getDate()+diff);
  const dias=[];for(let i=0;i<7;i++){const d=new Date(lunes);d.setDate(lunes.getDate()+i);dias.push(d);}
  const todasH=new Set();dias.forEach(d=>horasFecha(d).forEach(h=>todasH.add(h)));
  const hOrd=[...todasH].sort((a,b)=>horaNum(a)-horaNum(b));
  const tS=dateStr(today),g=document.getElementById('vSem');g.innerHTML='';
  const wg=document.createElement('div');wg.className='week-grid';
  wg.style.gridTemplateColumns='60px '+Array(7).fill('1fr').join(' ');
  g.appendChild(wg);
  const corner=document.createElement('div');corner.className='week-header';wg.appendChild(corner);
  dias.forEach(d=>{
    const dS=dateStr(d);
    const h=document.createElement('div');
    h.className='week-header'+(dS===tS?' today-col':'');
    h.innerHTML=`${DIAS[d.getDay()]}<br><strong style="font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:300">${d.getDate()}</strong><br><span style="font-size:10px">${horasFecha(d).length?'✦':'—'}</span>`;
    wg.appendChild(h);
  });
  hOrd.forEach(hora=>{
    const tl=document.createElement('div');tl.className='week-cell time-col';tl.textContent=hora;wg.appendChild(tl);
    dias.forEach(d=>{
      const cell=document.createElement('div');cell.className='week-cell';
      const dS=dateStr(d),horas=horasFecha(d);
      if(!horas.includes(hora)){cell.classList.add('bloqueada');}
      else{
        const cita=citas.find(c=>c.fecha===dS&&c.hora===hora);
        if(cita){const b=document.createElement('div');b.className='week-cita';b.textContent=cita.nombre;b.onclick=e=>{e.stopPropagation();editarCita(cita.id);};cell.appendChild(b);}
        else cell.onclick=()=>{selectedDate=new Date(d);currentView='dia';openModalAdmin(hora);};
      }
      wg.appendChild(cell);
    });
  });
  const fin=dias[6];
  document.getElementById('fTitle').textContent=lunes.getDate()+' '+MESES[lunes.getMonth()]+' – '+fin.getDate()+' '+MESES[fin.getMonth()];
  const total=citas.filter(c=>{const d=parseDate(c.fecha);return d>=lunes&&d<=fin;}).length;
  document.getElementById('fSub').textContent=total===0?'Sin citas esta semana':total+' cita'+(total!==1?'s':'')+' esta semana';
}

  <div class="modal-row"><label class="inp-label">Nombre</label><input class="inp" id="mN" placeholder="Nombre del cliente"></div>
  <div class="modal-row"><label class="inp-label">Teléfono</label><input class="inp" id="mT" placeholder="+56 9 xxxx xxxx" inputmode="tel"></div>
  <div class="modal-row"><label class="inp-label">Servicio</label><select class="inp" id="mS">${sOpt}</select></div>
  <div class="modal-row"><label class="inp-label">Hora</label>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="inp" id="mH" style="flex:1" onchange="syncHoraCustom(this.value)">${hOpt}<option value="custom">✎ Ingresar hora personalizada...</option></select>
      ${selectorHora24('mHcustom','',true)}
    </div>
  </div>
  <div class="modal-row"><label class="inp-label">Fecha</label><input class="inp" type="date" id="mF" value="${dS}"></div>
  <div class="modal-row"><label class="inp-label">Notas</label><input class="inp" id="mNt" placeholder="Opcional"></div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarCitaAdmin()">Guardar</button></div>`;
  document.getElementById('modalBg').classList.add('open');
};
window.editarCita=function(id){
  const c=citas.find(x=>x.id===id);if(!c)return;editId=id;
  const horas=horasFecha(parseDate(c.fecha));
  const hOpt=horas.map(x=>`<option value="${x}"${x===c.hora?' selected':''}>${x}</option>`).join('');
  const sOpt=SERVICIOS.map(s=>`<option value="${s.nombre}"${s.nombre===c.servicio?' selected':''}>${s.nombre}</option>`).join('');
  document.getElementById('modalContent').innerHTML=`
  <h3 class="modal-title">Editar cita</h3>
  <div class="modal-row"><label class="inp-label">Nombre</label><input class="inp" id="mN" value="${c.nombre||''}"></div>
  <div class="modal-row"><label class="inp-label">Teléfono</label><input class="inp" id="mT" value="${c.telefono||''}"></div>
  <div class="modal-row"><label class="inp-label">Servicio</label><select class="inp" id="mS">${sOpt}</select></div>
  <div class="modal-row"><label class="inp-label">Hora</label>
    <div style="display:flex;gap:8px;align-items:center">
      <select class="inp" id="mH" style="flex:1" onchange="syncHoraCustom(this.value)">${hOpt}<option value="custom">✎ Ingresar hora personalizada...</option></select>
      ${selectorHora24('mHcustom',!horas.includes(c.hora)?c.hora:'',horas.includes(c.hora))}
    </div>
  </div>
  <div class="modal-row"><label class="inp-label">Fecha</label><input class="inp" type="date" id="mF" value="${c.fecha}"></div>
  <div class="modal-row"><label class="inp-label">Notas</label><input class="inp" id="mNt" value="${c.notas||''}"></div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarCitaAdmin()">Actualizar</button></div>`;
  document.getElementById('modalBg').classList.add('open');
};
window.guardarCitaAdmin=async function(){
  const nombre=document.getElementById('mN').value.trim(),fecha=document.getElementById('mF').value;
  const horaRaw=document.getElementById('mH').value;
  const horaCustom=valorHora24('mHcustom');
  const hora=horaRaw==='custom'?horaCustom:horaRaw;
  const servicio=document.getElementById('mS').value,tel=document.getElementById('mT').value.trim(),notas=document.getElementById('mNt').value.trim();
  if(!nombre||!fecha||!hora){showToast('Completa los campos obligatorios');return;}
  if(horaRaw==='custom'&&!horaCustom){showToast('Ingresa la hora personalizada');return;}
  if(citas.find(c=>c.fecha===fecha&&c.hora===hora&&c.id!==editId)){showToast('Ese horario ya está ocupado');return;}
  try{
    const data={nombre,fecha,hora,servicio,telefono:tel,notas,creadoEn:new Date().toISOString()};
    if(editId)await db.collection('citas').doc(editId).update(data);
    else await db.collection('citas').add(data);
    showToast(editId?'Cita actualizada':'Cita agendada');closeModal();
  }catch(e){showToast('Error al guardar');}
};
window.eliminarCita=async function(id){
  if(!confirm('¿Eliminar esta cita?'))return;
  await db.collection('citas').doc(id).delete();showToast('Cita eliminada');
};

// ── CONFIG HORARIOS ───────────────────────────────────────────
window.abrirConfigHorarios=function(fecha=''){
  CONFIG_FECHA=fecha||dateStr(selectedDate);
  CONFIG_HORAS=[...(DISPONIBILIDAD[CONFIG_FECHA]||[])].sort((a,b)=>horaNum(a)-horaNum(b));
  document.getElementById('modalContent').innerHTML=`
  <h3 class="modal-title">Disponibilidad por fecha</h3>
  <p style="font-size:12px;color:var(--ink-muted);margin-bottom:1rem;line-height:1.6">Elige una fecha y agrega solamente las horas en que atenderás. Los clientes no verán ningún horario que no publiques aquí.</p>
  <div class="modal-row"><label class="inp-label">Fecha</label><input class="inp" type="date" id="cfgFecha" value="${CONFIG_FECHA}" min="${dateStr(today)}" onchange="cambiarFechaConfig(this.value)"></div>
  <div class="turno-cfg">
    <div class="turno-cfg-title">✦ Horarios publicados</div>
    <div class="horas-config-grid" id="hg-fecha">
      ${CONFIG_HORAS.length?CONFIG_HORAS.map(h=>`<div class="hora-tag" id="ht-fecha-${h.replace(':','')}">${h}<button class="rm" onclick="qH('${h}')">×</button></div>`).join(''):'<span id="sinHorasCfg" style="font-size:12px;color:var(--ink-muted)">Todavía no hay horarios.</span>'}
    </div>
    <div class="add-hora-row">
      ${selectorHora24('nh-fecha')}
      <button class="btn btn-sm" onclick="aH()">Agregar hora</button>
    </div>
  </div>
  <div class="modal-actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="guardarHoras()">Guardar cambios</button></div>`;
  document.getElementById('modalBg').classList.add('open');
};
window.cambiarFechaConfig=function(fecha){abrirConfigHorarios(fecha);};
window.qH=function(hora){CONFIG_HORAS=CONFIG_HORAS.filter(h=>h!==hora);document.getElementById(`ht-fecha-${hora.replace(':','')}`)?.remove();if(!CONFIG_HORAS.length)document.getElementById('hg-fecha').innerHTML='<span id="sinHorasCfg" style="font-size:12px;color:var(--ink-muted)">Todavía no hay horarios.</span>';};
window.aH=function(){
  const val=valorHora24('nh-fecha');if(!val){showToast('Selecciona hora y minutos');return;}
  const[hh,mm]=val.split(':');const hora=`${hh}:${mm}`;
  if(CONFIG_HORAS.includes(hora)){showToast('Esa hora ya existe');return;}
  CONFIG_HORAS.push(hora);CONFIG_HORAS.sort((a,b)=>horaNum(a)-horaNum(b));
  document.getElementById('sinHorasCfg')?.remove();
  const tag=document.createElement('div');tag.className='hora-tag';tag.id=`ht-fecha-${hora.replace(':','')}`;
  tag.innerHTML=`${hora}<button class="rm" onclick="qH('${hora}')">×</button>`;
  document.getElementById('hg-fecha').appendChild(tag);
  document.getElementById('nh-fecha-hh').value='';document.getElementById('nh-fecha-mm').value='';document.getElementById('nh-fecha-display').textContent='Seleccionar hora';
};
window.guardarHoras=async function(){
  try{if(CONFIG_HORAS.length)DISPONIBILIDAD[CONFIG_FECHA]=[...CONFIG_HORAS];else delete DISPONIBILIDAD[CONFIG_FECHA];await db.collection('citas').doc('config_horarios').set({disponibilidad:DISPONIBILIDAD,fecha:'0000-00-00',hora:'00:00',tipo:'configuracion',actualizado:new Date().toISOString()});selectedDate=parseDate(CONFIG_FECHA);showToast('Disponibilidad guardada ✓');closeModal();renderAdmin();}
  catch(e){console.error(e);showToast('No se pudo guardar. Intenta nuevamente.');}
};
window.closeModal=function(){document.getElementById('modalBg').classList.remove('open');};
window.syncHoraCustom=function(val){
  const inp=document.getElementById('mHcustom-wrap');
  if(!inp)return;
  if(val==='custom'){inp.style.display='';inp.focus();}
  else inp.style.display='none';
};

// ══════════════════════════════════════════════════════════════
// CLIENTE
// ══════════════════════════════════════════════════════════════
function renderCliente(){
  if(!citasLoaded){document.getElementById('appRoot').innerHTML=`<div class="loading-screen"><div class="spinner"></div><div class="loading-txt">Cargando horarios</div></div>`;return;}
  if(miCitaId){const c=citas.find(x=>x.id===miCitaId);if(c&&c.fecha>=dateStr(today)){renderMiCita(c);return;}else{miCitaId=null;localStorage.removeItem('skinlux_mi_cita');}}
  // Próximas 7 fechas configuradas manualmente con horas libres
  const dias7=[];let cur=new Date(today);
  while(dias7.length<7){
    const cD=citas.filter(c=>c.fecha===dateStr(cur)),lib=horasFecha(cur).filter(h=>!cD.some(c=>c.hora===h));
    if(lib.length>0)dias7.push(new Date(cur));
    cur.setDate(cur.getDate()+1);if(cur-today>180*24*60*60*1000)break;
  }
  if(!dias7.find(d=>dateStr(d)===dateStr(cFecha)))cFecha=dias7[0]||today;
  const citasSel=citas.filter(c=>c.fecha===dateStr(cFecha)),hSel=horasFecha(cFecha);
  document.getElementById('appRoot').innerHTML=`
  <div class="cliente-wrap">
    <div class="booking-intro">
      <div class="booking-eyebrow">Agenda online</div>
      <h1 class="booking-title">Reserva tu experiencia Skin Lux</h1>
      <p class="booking-subtitle">Selecciona un servicio para consultar su valor y ver la disponibilidad en tiempo real.</p>
    </div>
    <div class="steps">
      ${[1,2,3].map(i=>`<div class="step${i===cStep?' active':i<cStep?' done':''}"></div>`).join('')}
    </div>
    ${cStep===1?`
    <div class="reserva-grid">
      <section class="reserva-panel">
        <div class="section-h">1. Elige un servicio</div>
        <div class="servicios-list">
          ${SERVICIOS.map(s=>`
          <div class="servicio-card${cServicio===s.nombre?' selected':''}" onclick="sServ('${s.nombre}')">
            <div><div class="serv-nombre">${s.nombre}</div><div class="serv-dur">${s.duracion}</div></div>
            <div style="display:flex;align-items:center;gap:8px"><span class="serv-precio">${s.precio}</span>${cServicio===s.nombre?'<span class="serv-check">✓</span>':''}</div>
          </div>`).join('')}
        </div>
      </section>
      <section class="reserva-panel">
        ${!cServicio?`<div class="reserva-placeholder">Selecciona un servicio a la izquierda para ver los días y horarios disponibles.</div>`:`
        <div class="section-h">2. Elige un día</div>
        <div class="dias-scroll">
          ${dias7.length?dias7.map(d=>{const cD=citas.filter(c=>c.fecha===dateStr(d));const lib=horasFecha(d).some(h=>!cD.some(c=>c.hora===h));
            return`<button class="dia-btn${dateStr(d)===dateStr(cFecha)?' selected':''}" onclick="sDia('${dateStr(d)}')"><span class="dia-nom">${DIAS[d.getDay()]}</span><span class="dia-num">${d.getDate()}</span>${lib?'<span class="dia-dot"></span>':''}</button>`;}).join('')
            :'<p style="font-size:13px;color:var(--ink-muted);font-style:italic;padding:.5rem 0">No hay fechas disponibles por el momento.</p>'}
        </div>
        <div class="section-h" style="font-size:15px;margin-bottom:.75rem">Horarios · ${cFecha.getDate()} de ${MESES[cFecha.getMonth()]}</div>
        <div class="horas-grid">
          ${hSel.length===0?'<p style="font-size:13px;color:var(--ink-muted);grid-column:1/-1;font-style:italic">Sin horarios este día.</p>':
            hSel.map(h=>{const oc=citasSel.some(c=>c.hora===h);return`<button class="hora-btn${h===cHora?' selected':''}${oc?' ocupada':''}" onclick="${oc?'':` ` + `sHora('${h}')`}">${h}</button>`;}).join('')}
        </div>
        ${cHora?`<button class="btn btn-primary" style="width:100%;padding:13px;margin-top:.5rem" onclick="cStep=2;renderCliente()">Continuar →</button>`:''}
        `}
      </section>
    </div>
    `:''}
    ${cStep===2?`
    <div style="max-width:540px;margin:0 auto">
    <button class="btn btn-ghost btn-sm" style="margin-bottom:1rem;padding-left:0" onclick="cStep=1;renderCliente()">← Volver</button>
    <div class="section-h">Tus datos</div>
    <div class="form-group"><label class="inp-label">Nombre completo</label><input class="inp" id="cN" placeholder="Tu nombre" value="${window._cN||''}"></div>
    <div class="form-group"><label class="inp-label">Teléfono</label><input class="inp" id="cT" placeholder="+56 9 xxxx xxxx" inputmode="tel" value="${window._cT||''}"></div>
    <div class="form-group"><label class="inp-label">Email <span style="color:var(--brown)">*</span></label><input class="inp" id="cE" placeholder="Te llegará la confirmación de tu cita" type="email" value="${window._cE||''}"></div>
    <button class="btn btn-primary" style="width:100%;padding:13px;margin-top:.5rem" onclick="avanzar3()">Revisar reserva →</button>
    </div>
    `:''}
    ${cStep===3?`
    <div style="max-width:540px;margin:0 auto">
    <button class="btn btn-ghost btn-sm" style="margin-bottom:1rem;padding-left:0" onclick="cStep=2;renderCliente()">← Volver</button>
    <div class="section-h">Confirma tu reserva</div>
    <div class="confirm-box">
      <div class="confirm-row"><span class="confirm-lbl">Día</span><span class="confirm-val">${DIASL[cFecha.getDay()]}, ${cFecha.getDate()} de ${MESES[cFecha.getMonth()]}</span></div>
      <div class="confirm-row"><span class="confirm-lbl">Hora</span><span class="confirm-val">${cHora}</span></div>
      <div class="confirm-sep"></div>
      <div class="confirm-row"><span class="confirm-lbl">Servicio</span><span class="confirm-val">${cServicio}</span></div>
      <div class="confirm-row"><span class="confirm-lbl">Valor a pagar</span><span class="confirm-val" style="font-size:18px;color:var(--gold)">${SERVICIOS.find(s=>s.nombre===cServicio)?.precio||'—'}</span></div>
      <div style="font-size:10px;color:var(--ink-muted);text-align:right;margin-top:2px">Pago con débito o crédito</div>
      <div class="confirm-sep"></div>
      <div class="confirm-row"><span class="confirm-lbl">Nombre</span><span class="confirm-val">${window._cN||''}</span></div>
      <div class="confirm-row"><span class="confirm-lbl">Teléfono</span><span class="confirm-val">${window._cT||'—'}</span></div>
    </div>
    <button class="btn btn-primary" style="width:100%;padding:13px" id="btnConf" onclick="confirmarCita()">Confirmar reserva</button>
    </div>
    `:''}
  </div>`;
}
window.sDia=function(dS){cFecha=parseDate(dS);cHora=null;renderCliente();};
window.sHora=function(h){cHora=h;renderCliente();};
window.sServ=function(s){if(cServicio!==s)cHora=null;cServicio=s;renderCliente();};
window.avanzar3=function(){
  const n=document.getElementById('cN').value.trim();if(!n){showToast('Ingresa tu nombre');return;}
  const e=document.getElementById('cE').value.trim();
  if(!e){showToast('Ingresa tu email para recibir la confirmación');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){showToast('Email inválido');return;}
  window._cN=n;window._cT=document.getElementById('cT').value.trim();window._cE=e;
  cStep=3;renderCliente();
};
window.confirmarCita=async function(){
  const btn=document.getElementById('btnConf');btn.disabled=true;btn.textContent='Agendando...';
  if(citas.find(c=>c.fecha===dateStr(cFecha)&&c.hora===cHora)){showToast('Ese horario ya fue tomado, elige otro');cStep=1;cHora=null;renderCliente();return;}
  try{
    const precio=SERVICIOS.find(s=>s.nombre===cServicio)?.precio||'';
    const data={nombre:window._cN,telefono:window._cT,email:window._cE||'',fecha:dateStr(cFecha),hora:cHora,servicio:cServicio,precio,creadoEn:new Date().toISOString()};
    const ref=await db.collection('citas').add(data);
    miCitaId=ref.id;localStorage.setItem('skinlux_mi_cita',ref.id);
    const emailParams=(destino,destinatario)=>({
      to_email:destino,email:destino,user_email:destino,reply_to:data.email,
      to_name:destinatario,name:data.nombre,from_name:data.nombre,
      nombre:data.nombre,nombre_cliente:data.nombre,cliente:data.nombre,
      fecha:data.fecha,hora:data.hora,servicio:data.servicio,
      valor:data.precio,precio:data.precio,telefono:data.telefono||'—'
    });
    // Email a Javi; EmailJS envía automáticamente la plantilla vinculada al cliente.
    try{await emailjs.send("service_r73o47s","template_smf6n3r",emailParams("javicarmonaortiz@gmail.com","Javiera"));}catch(e){console.error('email javi:',e);}
    showToast('¡Reserva confirmada!');cStep=1;cHora=null;cServicio=null;renderCliente();
  }catch(e){btn.disabled=false;btn.textContent='Confirmar reserva';showToast('Error al agendar');}
};
function renderMiCita(c){
  const d=parseDate(c.fecha);
  document.getElementById('appRoot').innerHTML=`
  <div class="cliente-wrap">
    <div class="mi-cita-card">
      <div class="mi-cita-title">Tu reserva está confirmada</div>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink-soft)">
        <div><strong style="color:var(--ink)">${DIASL[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}</strong></div>
        <div>${c.hora} &nbsp;·&nbsp; ${c.servicio}</div>
        <div>Valor a pagar: <strong style="font-size:17px;color:var(--gold)">${c.precio||SERVICIOS.find(s=>s.nombre===c.servicio)?.precio||'—'}</strong></div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--ink-muted);margin-bottom:1.5rem;line-height:1.7">¿Necesitas cancelar o cambiar tu hora? Escríbenos directamente.</p>
    <button class="btn" style="width:100%;margin-bottom:10px" onclick="cancelarMiCita()">Cancelar mi reserva</button>
    <a href="https://skin-lux.cl" class="btn btn-primary" style="display:block;text-align:center;text-decoration:none">Volver a Skin Lux</a>
  </div>`;
}
window.cancelarMiCita=async function(){
  if(!confirm('¿Cancelar tu reserva?'))return;
  if(miCitaId)await db.collection('citas').doc(miCitaId).delete();
  miCitaId=null;localStorage.removeItem('skinlux_mi_cita');renderCliente();
};
</script>
</body>
</html>
